name: build-v2

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release --workspace
      - name: Test
        run: cargo test --workspace
      - name: Stage librime (vendored rime.dll + data)
        shell: pwsh
        run: |
          Copy-Item "vendor/rime/rime.dll" "target/release/" -ErrorAction Stop
          Copy-Item "vendor/rime/data" "target/release/data" -Recurse -ErrorAction Stop
          Write-Output "staged rime.dll + data"
      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          makensis "scripts/installer.nsi"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nineime-v2
          path: |
            target/release/nineime_tsf.dll
            target/release/nineime-server.exe
            target/release/nineime-deployer.exe
            target/release/nineime-console.exe
            target/release/rime.dll
            target/release/data
            target/release/9IME-Setup-0.1.0.exe